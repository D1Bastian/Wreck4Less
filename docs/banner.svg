      <stop offset="0%" stop-color="#FF2A2A"/>
      <stop offset="100%" stop-color="#B30000"/>
    </linearGradient>
    <radialGradient id="spot" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#1B1B1B"/>
      <stop offset="100%" stop-color="#000000"/>
