  <text x="120" y="275" font-family="Arial, sans-serif" font-size="18" fill="#200000">Private dispatch for drivers, customers, and admins</text>
  <text x="650" y="150" font-family="Arial Black, Arial, sans-serif" font-size="52" fill="#FFFFFF" letter-spacing="2">WRECK4LESS</text>
